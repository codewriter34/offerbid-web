# Next.js 15 App Router. Netlify installs the OpenNext adapter automatically —
# do not pin @netlify/plugin-nextjs here or you miss runtime updates.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

# Site env (set in Netlify UI → Site configuration → Environment variables):
#   NEXT_PUBLIC_API_BASE_URL     https://<api-host>/api/v1
#   NEXT_PUBLIC_SOCKET_URL       wss://<api-host>/realtime
#   NEXT_PUBLIC_GOOGLE_CLIENT_ID <Google Identity Services client ID>
#   NEXT_PUBLIC_APP_URL          https://<this-site>.netlify.app  (or custom domain)
#
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'"

